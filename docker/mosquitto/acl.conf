# ── Mosquitto ACL Configuration ──────────────────────────
# Pattern-based access control for multi-tenant isolation
# ─────────────────────────────────────────────────────────

# Ingestor service account — can subscribe to all telemetry topics
user purecast_ingestor
topic read purecast/+/+/telemetry
topic read purecast/+/+/status
topic read purecast/+/+/events
topic write purecast/+/+/config

# Device pattern: each device can only publish to its own topics
# Devices authenticate with per-device credentials (tenant_id/device_id)
pattern write purecast/%u/telemetry
pattern write purecast/%u/status
pattern write purecast/%u/events
pattern read purecast/%u/config
