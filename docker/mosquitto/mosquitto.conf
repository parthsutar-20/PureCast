# ── Mosquitto Configuration ──────────────────────────────
# Dev configuration — TLS should be enabled for production
# ─────────────────────────────────────────────────────────

# Listener for MQTT protocol
listener 1883
protocol mqtt

# Listener for WebSocket (for browser-based clients)
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Message size limit (64KB — telemetry payloads are ~60 bytes)
message_size_limit 65536

# Keepalive
max_keepalive 120

# Connection limits
max_connections -1
