apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: purecast
    user: purecast
    secureJsonData:
      password: purecast_dev
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    editable: false
